# backend/render.yaml

services:
  - type: web
    name: ronohs-decor-backend
    env: python
    region: frankfurt
    plan: free
    # rootDir is not needed if the yaml is in the same directory
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: "gunicorn ronohs_decor_backend.wsgi"
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_SECRET_KEY
        generateValue: true # Render will generate a secure secret key
      - key: DATABASE_URL
        fromService: # CORRECTED: Use fromService instead of fromDatabase
          type: psql
          name: ronohs-decor-db
          property: connectionString # CORRECTED: Use connectionString
      # Let's remove CLOUDINARY_URL and other secrets from here.
      # It is much safer to manage these secrets only in the Render dashboard's UI.
      # They will still be available to your application.

databases:
  - name: ronohs-decor-db
    plan: free
    databaseName: ronohs_decor
    user: ronohs_user